services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: persona_editor
      POSTGRES_USER: persona
      POSTGRES_PASSWORD: ${PERSONA_DATABASE_PASSWORD:?set PERSONA_DATABASE_PASSWORD}
    volumes:
      - persona-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persona -d persona_editor"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - persona-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  editor:
    build: .
    environment:
      PERSONA_INFRASTRUCTURE: postgres-redis
      PERSONA_DATABASE_URL: jdbc:postgresql://postgres:5432/persona_editor
      PERSONA_DATABASE_USER: persona
      PERSONA_DATABASE_PASSWORD: ${PERSONA_DATABASE_PASSWORD:?set PERSONA_DATABASE_PASSWORD}
      PERSONA_REDIS_HOST: redis
      PERSONA_REDIS_PORT: 6379
      PERSONA_PUBLIC_URL: ${PERSONA_PUBLIC_URL:-http://localhost:8080}
      PERSONA_PUBLIC_WS_URL: ${PERSONA_PUBLIC_WS_URL:-ws://localhost:8080}
      PERSONA_ACTUATOR_TOKEN: ${PERSONA_ACTUATOR_TOKEN:?set PERSONA_ACTUATOR_TOKEN}
      PERSONA_TELEMETRY_ENABLED: ${PERSONA_TELEMETRY_ENABLED:-false}
      PERSONA_OTLP_METRICS_ENABLED: ${PERSONA_OTLP_METRICS_ENABLED:-false}
      PERSONA_PUBLISH_CONFIRMATION_LIFETIME: ${PERSONA_PUBLISH_CONFIRMATION_LIFETIME:-5m}
      PERSONA_QUOTA_PUBLISH_REQUESTS: ${PERSONA_QUOTA_PUBLISH_REQUESTS:-20}
      PERSONA_RETENTION_REVISIONS: ${PERSONA_RETENTION_REVISIONS:-30d}
      PERSONA_RETENTION_DRAFTS: ${PERSONA_RETENTION_DRAFTS:-30d}
      PERSONA_RETENTION_PUBLISHES: ${PERSONA_RETENTION_PUBLISHES:-180d}
      PERSONA_RETENTION_AUDIT: ${PERSONA_RETENTION_AUDIT:-365d}
      PERSONA_RETENTION_MAX_REVISIONS: ${PERSONA_RETENTION_MAX_REVISIONS:-100}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://otel-collector:4318/v1/metrics}
    ports:
      - "127.0.0.1:${PERSONA_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --header='Authorization: Bearer '$$PERSONA_ACTUATOR_TOKEN -O - http://localhost:8080/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 20
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  persona-postgres:
  persona-redis:
