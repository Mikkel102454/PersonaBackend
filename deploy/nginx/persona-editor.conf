map $http_upgrade $persona_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream persona_editor {
    # Add all backend instances here. Redis coordinates sessions and live routing.
    server editor-1:8080;
    server editor-2:8080;
}

server {
    listen 443 ssl http2;
    server_name editor.example.com;
    ssl_certificate /etc/letsencrypt/live/editor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/editor.example.com/privkey.pem;

    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 70s;
    proxy_send_timeout 10s;

    location / {
        proxy_pass http://persona_editor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $persona_connection_upgrade;
    }
}
