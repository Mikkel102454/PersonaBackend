spring.application.name=PersonaBackend
spring.application.name=persona-editor
persona.editor.infrastructure=${PERSONA_INFRASTRUCTURE:postgres-redis}
persona.editor.administration.actuator-token=${PERSONA_ACTUATOR_TOKEN:}
spring.datasource.url=${PERSONA_DATABASE_URL:jdbc:postgresql://localhost:5432/persona_editor}
spring.datasource.username=${PERSONA_DATABASE_USER:persona}
spring.datasource.password=${PERSONA_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${PERSONA_DATABASE_POOL_SIZE:10}
spring.flyway.enabled=true
spring.data.redis.host=${PERSONA_REDIS_HOST:localhost}
spring.data.redis.port=${PERSONA_REDIS_PORT:6379}
spring.data.redis.password=${PERSONA_REDIS_PASSWORD:}
spring.data.redis.timeout=${PERSONA_REDIS_TIMEOUT:2s}
persona.editor.public-url=${PERSONA_PUBLIC_URL:http://localhost:8080}
persona.editor.public-web-socket-url=${PERSONA_PUBLIC_WS_URL:ws://localhost:8080}
persona.editor.session-lifetime=5m
persona.editor.request-clock-skew=1m
persona.editor.maximum-verification-attempts=5
persona.editor.socket-idle-timeout=45s
persona.editor.replay-capacity=256
persona.editor.relay.send-time-limit-millis=${PERSONA_RELAY_SEND_TIMEOUT_MS:5000}
persona.editor.relay.send-buffer-bytes=${PERSONA_RELAY_SEND_BUFFER_BYTES:2097152}
persona.editor.relay.presence-ttl=${PERSONA_RELAY_PRESENCE_TTL:60s}
persona.editor.quotas.session-creates-per-installation=${PERSONA_QUOTA_SESSION_CREATES:10}
persona.editor.quotas.verification-attempts-per-session=${PERSONA_QUOTA_VERIFICATION_ATTEMPTS:10}
persona.editor.quotas.connections-per-installation=${PERSONA_QUOTA_CONNECTIONS:30}
persona.editor.quotas.messages-per-session=${PERSONA_QUOTA_MESSAGES:600}
persona.editor.quotas.snapshots-per-session=${PERSONA_QUOTA_SNAPSHOTS:60}
persona.editor.quotas.drafts-per-session=${PERSONA_QUOTA_DRAFTS:120}
persona.editor.quotas.window=${PERSONA_QUOTA_WINDOW:1m}
persona.editor.publish.confirmation-lifetime=${PERSONA_PUBLISH_CONFIRMATION_LIFETIME:5m}
persona.editor.publish.requests-per-session=${PERSONA_QUOTA_PUBLISH_REQUESTS:20}
persona.editor.retention.revisions=${PERSONA_RETENTION_REVISIONS:30d}
persona.editor.retention.drafts=${PERSONA_RETENTION_DRAFTS:30d}
persona.editor.retention.publishes=${PERSONA_RETENTION_PUBLISHES:180d}
persona.editor.retention.audit=${PERSONA_RETENTION_AUDIT:365d}
persona.editor.retention.sweep-interval=${PERSONA_RETENTION_SWEEP_INTERVAL:1h}
persona.editor.retention.maximum-revisions-per-installation=${PERSONA_RETENTION_MAX_REVISIONS:100}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.max-file-size=10MB
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.tracing.sampling.probability=${PERSONA_TRACE_SAMPLE_RATE:0.05}
management.tracing.export.otlp.enabled=${PERSONA_TELEMETRY_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.otlp.metrics.export.enabled=${PERSONA_OTLP_METRICS_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
